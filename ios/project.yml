# Generate the Xcode project with:
#     brew install xcodegen && cd ios && xcodegen generate && open LocalCallStyle.xcodeproj
#
# Keeping the project as a YAML file instead of a checked-in .xcodeproj avoids merge conflicts
# in project.pbxproj and makes the whole target reviewable.
name: LocalCallStyle
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # fill in, or set the team in Xcode's Signing & Capabilities
    CODE_SIGN_STYLE: Automatic

targets:
  LocalCallStyle:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Local Call Style
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # `voip` is what lets CallKit present a call while the app is backgrounded.
        # `audio` keeps the looping ringtone alive in the background.
        UIBackgroundModes:
          - voip
          - audio
    entitlements:
      path: Resources/LocalCallStyle.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - sdk: CallKit.framework
      - sdk: PushKit.framework
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework
