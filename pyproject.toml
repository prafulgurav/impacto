[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impacto"
version = "0.1.0"
description = "Global events and policy decisions, mapped to Indian market impact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "apscheduler>=3.10",
  "cryptography>=42",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "feedparser>=6.0", "fredapi>=0.5"]
postgres = ["psycopg[binary]>=3.1"]
cache = ["redis>=5.0"]
llm = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "anthropic>=0.40"]

[project.scripts]
impacto = "impacto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: full precompute sweep and other multi-second acceptance checks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
